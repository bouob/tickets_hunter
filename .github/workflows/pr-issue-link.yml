name: PR Issue Link Check

# 強制「先開 Issue 再開 PR」：PR 內容必須連結對應 Issue。
# 使用 pull_request_target 是為了讓 fork 來的 PR 也能留言（GITHUB_TOKEN 才有寫入權限）。
# 全程不 checkout PR 的程式碼，也不執行 PR 內容，僅讀取 PR body。
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: write

jobs:
  check-issue-link:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 跳過維護者的 private -> public 同步 PR（public-sync-*）與發布分支；
    # 另外掛上 skip-issue-check 標籤可手動豁免。
    if: >-
      !startsWith(github.head_ref, 'public-sync-') &&
      !startsWith(github.head_ref, 'release/') &&
      !contains(github.event.pull_request.labels.*.name, 'skip-issue-check')

    steps:
      - name: Check PR body references an issue
        uses: actions/github-script@v7
        with:
          script: |
            const MARKER = '<!-- pr-issue-link-check -->';
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const issue_number = pr.number;

            // 先移除 HTML 註解，避免範本裡的提示文字被誤判為有效連結
            const body = (pr.body || '').replace(/<!--[\s\S]*?-->/g, '');

            const hasIssueRef =
              /#\d+/.test(body) ||
              /github\.com\/[\w.-]+\/[\w.-]+\/issues\/\d+/i.test(body);

            // 找出先前留下的提醒留言（用 marker 辨識，避免重複洗版）
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const previous = comments.find(c => (c.body || '').includes(MARKER));

            if (hasIssueRef) {
              if (previous) {
                await github.rest.issues.deleteComment({
                  owner, repo, comment_id: previous.id,
                });
              }
              core.info('PR 內容已連結 Issue，檢查通過。');
              return;
            }

            const reminder = [
              MARKER,
              '### ⚠️ 這個 PR 還沒有連結 Issue',
              '',
              '本專案採「**先開 Issue 再開 PR**」流程，PR 內容必須包含對應的 Issue 編號：',
              '',
              '```',
              'Closes #123',
              '```',
              '',
              '只處理該 Issue 的一部分時改用 `Refs #123`。',
              '',
              '該 Issue 需記錄 **問題描述**、**調查過程**（試過什麼、排除了什麼）、',
              '**調查結果（根因）** 與 **建議修法**——審查會直接對照這幾段。',
              '',
              '尚未開 Issue 的話，請先用 Issue 範本開一則，再回來編輯這個 PR 的內容。',
              '編輯後本檢查會自動重跑，補上編號即可通過。',
              '',
              '流程說明見 [CONTRIBUTING.md](https://github.com/bouob/tickets_hunter/blob/main/CONTRIBUTING.md#1-先開-issue必要步驟)。',
            ].join('\n');

            if (!previous) {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body: reminder,
              });
            }

            core.setFailed('PR 內容未連結任何 Issue（找不到 #編號 或 issue 連結）。');
